; ═══════════════════════════════════════════════════════════
;  presets.ini — Полные пресеты конфигурации макроса TD
;
;  Каждый пресет = одна секция [ИмяПресета], содержащая ВСЁ:
;    1. Координаты кнопок (калибровка)
;    2. Задержки (Delays)
;    3. Параметры ImageSearch
;    4. Параметры PixelSearch
;    5. Слоты всех карт (расположение юнитов)
;
;  При сохранении пресета в GUI сохраняются все эти данные.
;  При загрузке пресета — все данные применяются и сразу
;  записываются в:
;    • config.ini             (координаты кнопок)
;    • ahk\settings.ini       (задержки + ImageSearch + PixelSearch)
;    • maps\<Map>_slots.ini   (слоты каждой карты)
;
;  Формат слотов карты:
;    Map_<idx>_Name      = <имя карты, как в MapList>
;    Map_<idx>_SlotCount = <количество слотов>
;    Map_<idx>_Slot_<n>  = <номер юнита>,<x>,<y>
;  где idx — порядковый номер карты в MapList (1..MapCount),
;  а n — порядковый номер слота (1..SlotCount).
; ═══════════════════════════════════════════════════════════

