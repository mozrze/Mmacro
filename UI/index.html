<!DOCTYPE html>
<html lang="ru" xmlns:xlink="http://www.w3.org/1999/xlink">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TD Macro Control</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <!-- Спрайт иконок вклеен прямо в документ: IE/Trident (движок Shell.Explorer,
         которым main.ahk встраивает эту страницу) не поддерживает <use> на
         спрайт из ОТДЕЛЬНОГО svg-файла — работает только ссылка на #id
         внутри того же документа. Раньше иконки грузились из assets/icons.svg
         и поэтому не показывались вообще (пустые кнопки, "уехавший" текст). -->
    <svg style="display:none;" aria-hidden="true">
        <symbol id="icon-window" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <path d="M3 9h18"/>
        </symbol>
        <symbol id="icon-embed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 6 4 12l5 6"/>
            <path d="M15 6l5 6-5 6"/>
        </symbol>
        <symbol id="icon-map" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/>
            <path d="M9 4v14"/>
            <path d="M15 6v14"/>
        </symbol>
        <symbol id="icon-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L19 6h0a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>
            <circle cx="12" cy="13" r="3.5"/>
        </symbol>
        <symbol id="icon-target" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="7"/>
            <circle cx="12" cy="12" r="2.5"/>
            <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
        </symbol>
        <symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h16"/>
            <path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
            <path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/>
            <path d="M10 11v6M14 11v6"/>
        </symbol>
        <symbol id="icon-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="m6 9 6 6 6-6"/>
        </symbol>
        <symbol id="icon-play" viewBox="0 0 24 24" fill="currentColor" stroke="none">
            <path d="M8 5.5v13a1 1 0 0 0 1.5.87l11-6.5a1 1 0 0 0 0-1.74l-11-6.5A1 1 0 0 0 8 5.5Z"/>
        </symbol>
        <symbol id="icon-stop" viewBox="0 0 24 24" fill="currentColor" stroke="none">
            <rect x="6" y="6" width="12" height="12" rx="1.5"/>
        </symbol>
        <symbol id="icon-sliders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/>
            <circle cx="16" cy="6" r="2"/>
            <circle cx="10" cy="12" r="2"/>
            <circle cx="18" cy="18" r="2"/>
        </symbol>
        <symbol id="icon-terminal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <path d="m7 9 3 3-3 3"/>
            <path d="M13 15h4"/>
        </symbol>
        <symbol id="icon-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/>
        </symbol>
        <symbol id="icon-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 3 9 5-9 5-9-5 9-5Z"/>
            <path d="m3 13 9 5 9-5"/>
        </symbol>
        <symbol id="icon-crosshair" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 3v4M12 17v4M3 12h4M17 12h4"/>
            <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
        </symbol>
        <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m5 12 5 5 9-11"/>
        </symbol>
        <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 6l12 12M18 6 6 18"/>
        </symbol>
    </svg>

    <div class="app">

        <!-- ========== Область встраивания игры ========== -->
        <main class="stage">
            <div class="stage__viewport" id="gameArea">
                <!-- Сюда встраивается окно Roblox -->
                <div class="stage__placeholder" id="stagePlaceholder">
                    <svg class="stage__placeholder-icon" width="56" height="56" aria-hidden="true">
                        <use xlink:href="#icon-window" href="#icon-window"></use>
                    </svg>
                    <p class="stage__placeholder-title">Область встраивания Roblox</p>
                    <p class="stage__placeholder-hint">Нажми «Встроить» справа</p>
                </div>
            </div>

            <div class="stage__statusbar">
                <span class="dot" id="winStatusDot" data-state="unknown"></span>
                <span class="stage__status-text" id="windowStatus">Статус: не проверено</span>
            </div>
        </main>

        <!-- ========== Боковая панель управления ========== -->
        <aside class="sidebar">

            <header class="sidebar__header">
                <span class="sidebar__brand">TD MACRO</span>
            </header>

            <!-- ---------- ОКНО ИГРЫ ---------- -->
            <section class="panel">
                <h2 class="panel__title">
                    <svg class="panel__icon" aria-hidden="true"><use xlink:href="#icon-window" href="#icon-window"></use></svg>
                    Окно игры
                </h2>
                <button class="btn btn--block" id="btnEmbed" type="button">
                    <svg class="btn__icon" aria-hidden="true"><use xlink:href="#icon-embed" href="#icon-embed"></use></svg>
                    Встроить Roblox сюда
                </button>
            </section>

            <!-- ---------- КАРТА И РАЗМЕТКА ---------- -->
            <section class="panel">
                <h2 class="panel__title">
                    <svg class="panel__icon" aria-hidden="true"><use xlink:href="#icon-map" href="#icon-map"></use></svg>
                    Карта и разметка
                </h2>

                <div class="select" id="mapSelect" data-open="false">
                    <button class="select__trigger" id="mapSelectTrigger" type="button">
                        <span class="select__value" id="mapSelectValue">Карта не выбрана</span>
                        <svg class="select__chevron" aria-hidden="true"><use xlink:href="#icon-chevron" href="#icon-chevron"></use></svg>
                    </button>
                    <ul class="select__list" id="mapSelectList" role="listbox" hidden></ul>
                </div>

                <button class="btn btn--block" id="btnCapture" type="button">
                    <svg class="btn__icon" aria-hidden="true"><use xlink:href="#icon-camera" href="#icon-camera"></use></svg>
                    Сделать снимок карты
                </button>
                <button class="btn btn--block" id="btnMark" type="button">
                    <svg class="btn__icon" aria-hidden="true"><use xlink:href="#icon-target" href="#icon-target"></use></svg>
                    Разметить слоты карты
                </button>
                <button class="btn btn--block btn--ghost" id="btnClear" type="button">
                    <svg class="btn__icon" aria-hidden="true"><use xlink:href="#icon-trash" href="#icon-trash"></use></svg>
                    Очистить разметку карты
                </button>

                <p class="panel__status" id="offsetStatus">Up(0,0) Auto(0,0) Start(0,0) Repeat(0,0)</p>
            </section>

            <!-- ---------- ФАРМ ---------- -->
            <section class="panel">
                <h2 class="panel__title">
                    <svg class="panel__icon" aria-hidden="true"><use xlink:href="#icon-play" href="#icon-play"></use></svg>
                    Фарм
                </h2>

                <button class="btn btn--primary btn--block btn--lg" id="btnStartStop" type="button">
                    <svg class="btn__icon" aria-hidden="true"><use xlink:href="#icon-play" href="#icon-play"></use></svg>
                    <span id="startStopLabel">Старт (F9)</span>
                </button>

                <label class="toggle">
                    <input type="checkbox" id="autoUpgradeEnabled">
                    <span class="toggle__track"><span class="toggle__thumb"></span></span>
                    <span class="toggle__label">Автопрокачка юнитов</span>
                </label>

                <button class="btn btn--compact btn--block" id="btnAutoUpgradeSettings" type="button">
                    <svg class="btn__icon" aria-hidden="true"><use xlink:href="#icon-sliders" href="#icon-sliders"></use></svg>
                    Настройка автопрокачки
                </button>

                <p class="panel__status" id="farmStatus">Статус: остановлен</p>
            </section>

            <!-- ---------- ЛОГ ---------- -->
            <section class="panel panel--log">
                <h2 class="panel__title">
                    <svg class="panel__icon" aria-hidden="true"><use xlink:href="#icon-terminal" href="#icon-terminal"></use></svg>
                    Лог
                </h2>
                <div class="log" id="logBox" tabindex="0"></div>
            </section>

            <!-- ---------- Нижние кнопки ---------- -->
            <footer class="sidebar__footer">
                <button class="btn btn--compact btn--flex" id="btnSettings" type="button">
                    <svg class="btn__icon" aria-hidden="true"><use xlink:href="#icon-settings" href="#icon-settings"></use></svg>
                    Настройки
                </button>
                <button class="btn btn--compact btn--flex" id="btnPresets" type="button">
                    <svg class="btn__icon" aria-hidden="true"><use xlink:href="#icon-layers" href="#icon-layers"></use></svg>
                    Пресеты
                </button>
                <button class="btn btn--compact btn--flex" id="btnCalibration" type="button">
                    <svg class="btn__icon" aria-hidden="true"><use xlink:href="#icon-crosshair" href="#icon-crosshair"></use></svg>
                    Калибровка
                </button>
            </footer>

        </aside>
    </div>

    <script src="assets/app.js"></script>
</body>
</html>
